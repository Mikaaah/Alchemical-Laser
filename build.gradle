plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.3.0'
group = 'nl.mikaaah.alchemicallaser'
base { archivesName = 'create-alchemical-lasers' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java { withSourcesJar() }
repositories {
    maven { url = 'https://maven.createmod.net'; content {
        includeGroup 'com.simibubi.create'; includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel'
    } }
    maven { url = 'https://maven.ithundxr.dev/snapshots'; content { includeGroup 'com.tterrag.registrate' } }
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.terraformersmc.com/releases'; content { includeGroup 'dev.emi' } }
    mavenCentral()
}
neoForge {
    version = '21.1.219'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'alchemicallaser' }
    }
    mods { alchemicallaser { sourceSet sourceSets.main } }
}
dependencies {
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1:api'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') { from('THIRD_PARTY_NOTICES.md') }
